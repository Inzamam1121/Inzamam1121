name: Generate Snake Contribution SVG

on:
  # Refresh twice a day
  schedule: [{ cron: "0 */12 * * *" }]
  # Allow running manually from the Actions tab
  workflow_dispatch:
  push: { branches: ["main"] }

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Builds a snake animation from the profile owner's contribution graph
      - name: Generate contribution snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publishes to the `output` branch, served via raw.githubusercontent.com.
      # Keep target_branch as `output` — pointing this at main would wipe the repo.
      - name: Push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
